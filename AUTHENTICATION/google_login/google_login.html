<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login with Google</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf5ff,#fff);font:400 15px Arial,sans-serif;color:#26364b}.card{width:min(92vw,410px);padding:32px;background:white;border:1px solid #e1eaf7;border-radius:20px;box-shadow:0 18px 50px #174a8014;text-align:center}h1{font-weight:400;color:#1559a6}p{color:#64748b;line-height:1.6}a{color:#1769d2}</style></head><body><main class="card"><h1>Login with Google</h1>{% if configured is sameas false %}<p>Google sign-in is not configured yet. Add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and GOOGLE_REDIRECT_URI to your environment, then try again.</p>{% else %}<p>Continue securely with your Google account.</p>{% endif %}<p><a href="/login">Back to login</a></p></main></body></html>
