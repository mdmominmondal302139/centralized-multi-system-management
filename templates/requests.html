<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Requests</title><style>body{font-family:Arial;background:#f4f7fb}.wrap{width:96%;max-width:1300px;margin:25px auto}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 12px #0001}.btn{display:inline-block;padding:9px 12px;background:#374151;color:#fff;border-radius:7px;text-decoration:none;margin:3px}.red{background:#b91c1c}.wraptable{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;white-space:nowrap;text-align:left}th{background:#f3f4f6}</style></head><body><div class="wrap"><div class="card"><h1>Member Requests</h1><a class="btn" href="/developer">Back</a><div class="wraptable"><table><thead><tr><th>SL</th><th>Name</th><th>Mobile</th><th>Role</th><th>Term of Request Services</th><th>Details</th><th>Action</th></tr></thead><tbody>{% for r in requests %}<tr><td>{{loop.index}}</td><td>{{r.get('name','')}}</td><td>{{r.get('mobile','')}}</td><td>{{r.get('role','')}}</td><td>{{r.get('request_type','')}}</td><td>{{r.get('details','')}}</td><td><a class="btn red" href="/developer/request/delete/{{r.get('_id')}}" onclick="return confirm('Permanently delete this request?')">Delete</a></td></tr>{% else %}<tr><td colspan="7">No requests found.</td></tr>{% endfor %}</tbody></table></div></div></div></body></html>
