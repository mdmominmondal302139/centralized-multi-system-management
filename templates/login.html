<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fb;
        }

        .box {

            width: 100%;
            max-width: 420px;

            margin: 70px auto;

            background: #ffffff;

            padding: 28px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {

            margin: 0 0 25px 0;

            text-align: center;

            font-size: 26px;

            color: #111827;
        }

        label {

            display: block;

            margin-top: 12px;
            margin-bottom: 6px;

            font-size: 14px;

            color: #374151;
        }

        input {

            width: 100%;

            padding: 11px;

            margin: 0;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #2563eb;
        }

        button {

            width: 100%;

            padding: 11px;

            margin-top: 20px;

            border: 0;

            border-radius: 7px;

            background: #2563eb;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

    </style>

</head>


<body>

    <div class="box">

        <h1>My Expense Software</h1>


        <form method="post">

            <label>Username</label>

            <input
                type="text"
                name="login_value"
                autocomplete="username"
                pattern="[a-z0-9_]+"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                autocomplete="current-password"
                minlength="8"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
