<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Request</title><style>body{font-family:Arial;background:#f4f7fb}.box{max-width:600px;margin:60px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px #0001}select,textarea,button{width:100%;padding:11px;margin:7px 0;border:1px solid #ddd;border-radius:7px}.btn{display:inline-block;padding:9px 12px;background:#374151;color:#fff;border-radius:7px;text-decoration:none}.msg{padding:10px;background:#ecfdf5;color:#166534;border-radius:7px}</style></head><body><div class="box"><h1>Member Request</h1>{% if message %}<div class="msg">{{message}}</div>{% endif %}<form method="post"><label>Request Type</label><select name="request_type" required><option value="Open Member">Open Member</option><option value="Open Expense Developer">Open Expense Developer</option><option value="Term of Services request">Term of Services request</option></select><label>Details</label><textarea name="details" rows="5"></textarea><button>Submit Request</button></form><p><a class="btn" href="/dashboard">Back to Dashboard</a></p></div></body></html>
