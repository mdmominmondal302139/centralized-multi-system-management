<!doctype html>
<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Multi Member View</title>

<style>

body{
    font-family:Arial;
    background:#f4f7fb;
    margin:0;
}

.wrap{
    width:96%;
    max-width:1600px;
    margin:25px auto;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px #0001;
}

.btn{
    display:inline-block;
    padding:9px 12px;
    background:#374151;
    color:#fff;
    border-radius:7px;
    text-decoration:none;
    margin:3px;
}

.wraptable{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,
td{
    padding:9px;
    border-bottom:1px solid #e5e7eb;
    white-space:nowrap;
    text-align:left;
}

th{
    background:#f3f4f6;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="card">

        <h1>
            Multi Member {{module|title}}
        </h1>

        <a class="btn"
           href="/developer/multi-members">
            Back
        </a>

        <p>
            Selected:

            {% for m in members %}

                <b>{{m.get('name','')}}</b>

                {% if not loop.last %}
                    ,
                {% endif %}

            {% endfor %}

        </p>


        <div class="wraptable">

            <table>

                <thead>

                    <tr>

                    {% for h in headers %}

                        <th>
                            {{h}}
                        </th>

                    {% endfor %}

                    </tr>

                </thead>

                <tbody>

                {% for row in rows %}

                    <tr>

                    {% for v in row %}

                        <td>
                            {{v}}
                        </td>

                    {% endfor %}

                    </tr>

                {% else %}

                    <tr>

                        <td colspan="{{headers|length}}">
                            No records found.
                        </td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
