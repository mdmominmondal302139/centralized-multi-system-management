<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMBER — My Profile</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;background:#101827;color:#fff;padding:22px 15px;overflow:auto}.brand{font-size:19px;font-weight:800;margin-bottom:5px}.scope{font-size:12px;color:#aebbd0;margin-bottom:20px}.nav{display:block;width:100%;border:0;background:transparent;color:#dbe4f0;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#263750;color:#fff}.main{margin-left:270px;padding:28px;min-height:100vh}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:27px}.muted{color:#64748b;font-size:13px}.badge{padding:8px 12px;background:#e8eef8;border-radius:20px;font-size:12px;font-weight:700}.work{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;box-shadow:0 3px 12px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px}.card b{display:block;font-size:23px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.field,select,button,input,textarea{font:inherit}.field,select,input,textarea{padding:10px 11px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}.btn{border:0;background:#172033;color:#fff;padding:9px 13px;border-radius:7px;cursor:pointer}.btn.alt{background:#e8eef8;color:#172033}.btn.danger{background:#b42318}.btn.success{background:#166534}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.notice{padding:11px 13px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px}.grid,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0;padding:16px}.grid,.formgrid{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="brand">MEMBER</div><div class="scope">NORMAL USER / OWN RECORDS</div><button class="nav " data-path="home">🏠 Home</button><button class="nav active" data-path="profile">👤 My Profile</button><button class="nav " data-path="income">💰 My Income</button><button class="nav " data-path="expense">💸 My Expense</button><button class="nav " data-path="meal">🍽 My Meal</button><button class="nav " data-path="savings">💾 My Savings</button><button class="nav " data-path="records">📋 My Records</button><button class="nav " data-path="work">📝 My Work</button><button class="nav " data-path="logout">🚪 Logout</button></aside><main class="main"><div class="head"><div><h1>My Profile</h1><div class="muted">MEMBER working page — all data is limited to the logged-in Member.</div></div><div class="badge">MEMBER</div></div><section class="work"><div class="formgrid"><label>Name<input id="name"></label><label>Username<input id="username"></label><label>Member ID<input id="member_id" readonly></label><label>Mobile<input id="mobile"></label><label>Branch<input id="branch" readonly></label><label>Role<input id="role" readonly value="MEMBER"></label><label>Account Status<input id="status" readonly></label></div><br><button class="btn success" id="save">Update permitted profile</button><span id="msg" class="muted"></span><hr><h3>Password</h3><p class="muted">Password change should be connected to the system authentication service; this page does not expose another user's account controls.</p><button class="btn alt" type="button">Change Password</button></section></main><script>const qs=new URLSearchParams(location.search);const keep=qs.toString();document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{location.href='/member/'+b.dataset.path+(keep?'?'+keep:'')});</script><script>(async()=>{const p=new URLSearchParams(location.search);const r=await fetch('/member/api/profile?'+p);const x=await r.json();for(const k of ['name','username','member_id','mobile','branch','role','status']){document.getElementById(k).value=x[k]||''}document.getElementById('save').onclick=async()=>{const d={name:name.value,username:username.value,mobile:mobile.value};const z=await fetch('/member/api/profile?'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});msg.textContent=z.ok?' Updated':' Update failed'}})()</script></body></html>
