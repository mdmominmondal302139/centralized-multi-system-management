<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMBER — My Income</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033}.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;background:#101827;color:#fff;padding:22px 15px;overflow:auto}.brand{font-size:19px;font-weight:800;margin-bottom:5px}.scope{font-size:12px;color:#aebbd0;margin-bottom:20px}.nav{display:block;width:100%;border:0;background:transparent;color:#dbe4f0;text-align:left;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#263750;color:#fff}.main{margin-left:270px;padding:28px;min-height:100vh}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0 0 5px;font-size:27px}.muted{color:#64748b;font-size:13px}.badge{padding:8px 12px;background:#e8eef8;border-radius:20px;font-size:12px;font-weight:700}.work{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;box-shadow:0 3px 12px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px}.card b{display:block;font-size:23px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.field,select,button,input,textarea{font:inherit}.field,select,input,textarea{padding:10px 11px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}.btn{border:0;background:#172033;color:#fff;padding:9px 13px;border-radius:7px;cursor:pointer}.btn.alt{background:#e8eef8;color:#172033}.btn.danger{background:#b42318}.btn.success{background:#166534}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.notice{padding:11px 13px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px}.grid,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.sidebar{position:static;width:100%;height:auto}.main{margin-left:0;padding:16px}.grid,.formgrid{grid-template-columns:1fr}}</style></head><body><aside class="sidebar"><div class="brand">MEMBER</div><div class="scope">NORMAL USER / OWN RECORDS</div><button class="nav " data-path="home">🏠 Home</button><button class="nav " data-path="profile">👤 My Profile</button><button class="nav active" data-path="income">💰 My Income</button><button class="nav " data-path="expense">💸 My Expense</button><button class="nav " data-path="meal">🍽 My Meal</button><button class="nav " data-path="savings">💾 My Savings</button><button class="nav " data-path="records">📋 My Records</button><button class="nav " data-path="work">📝 My Work</button><button class="nav " data-path="logout">🚪 Logout</button></aside><main class="main"><div class="head"><div><h1>My Income</h1><div class="muted">MEMBER working page — all data is limited to the logged-in Member.</div></div><div class="badge">MEMBER</div></div><section class="work"><h2>My Income</h2><div class="toolbar"><label>Month <input id="month" type="month"></label><button class="btn" id="load">Load</button></div><form id="form"><div class="formgrid"><label>Amount<input id="f_amount" type=number step=0.01></label><label>Income Type<input id="f_income_type" ></label><label>Received Method<input id="f_received_method" ></label><label>Source<input id="f_source" ></label><label>Note<input id="f_note" ></label></div><br><button class="btn success">Add Record</button><button type="button" class="btn alt" id="clear">Clear</button></form><br><div id="msg" class="muted"></div><table><thead><tr><th>Amount</th><th>Income Type</th><th>Received Method</th><th>Source</th><th>Note</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const qs=new URLSearchParams(location.search);const keep=qs.toString();document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{location.href='/member/'+b.dataset.path+(keep?'?'+keep:'')});</script><script>
const p=new URLSearchParams(location.search),api='/member/api/income?'+p;
document.getElementById('month').value=new Date().toISOString().slice(0,7);
async function load(){const r=await fetch(api+'&month='+document.getElementById('month').value);const data=await r.json();document.getElementById('rows').innerHTML=data.map((x,i)=>`<tr><td>${x["amount"]||""}</td><td>${x["income_type"]||""}</td><td>${x["received_method"]||""}</td><td>${x["source"]||""}</td><td>${x["note"]||""}</td><td class="actions"><button class="btn alt" onclick="editRow(${i})">Edit</button><button class="btn danger" onclick="delRow(${i})">Delete</button></td></tr>`).join('');window.current=data}
let currentId=null;document.getElementById('form').onsubmit=async e=>{e.preventDefault();const d={"amount":document.getElementById("f_amount").value,"income_type":document.getElementById("f_income_type").value,"received_method":document.getElementById("f_received_method").value,"source":document.getElementById("f_source").value,"note":document.getElementById("f_note").value,month:document.getElementById('month').value,date:new Date().toISOString().slice(0,10)};const r=await fetch(currentId?('/member/api/income/'+currentId+'?'+p):api,{method:currentId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});currentId=null;document.getElementById('msg').textContent=r.ok?'Saved/updated':'Save failed';load()};
document.getElementById('clear').onclick=()=>{currentId=null;document.getElementById('form').reset()};
window.delRow=async i=>{const x=window.current[i];if(!confirm('Delete this own record?'))return;const id=x.id||x._id;await fetch('/member/api/income/'+id+'?'+p,{method:'DELETE'});load()};
window.editRow=i=>{const x=window.current[i];currentId=x.id||x._id;for(const n of ['amount', 'income_type', 'received_method', 'source', 'note'])document.getElementById('f_'+n).value=x[n]||'';document.getElementById('msg').textContent='Record loaded for editing.'};
document.getElementById('load').onclick=load;load();
</script></body></html>
