<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Test Blood Donor Account</title>
<link rel="stylesheet" href="/system_super_administrator/blood-donor-management/static/normal_blood_donor.css">
<style>
/* Permanent System Super Administrator sidebar. */
.ssa-shell{min-height:100vh}
.ssa-sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;background:#fff;border-right:1px solid #dce5ef;box-shadow:2px 0 12px rgba(16,44,80,.06);display:flex;flex-direction:column;z-index:1000}
.ssa-brand{padding:20px 18px 16px;border-bottom:1px solid #e7edf4;flex:0 0 auto}
.ssa-brand-title{font-size:16px;font-weight:800;color:#12355e;line-height:1.25}
.ssa-brand-scope{font-size:10px;color:#6f8299;margin-top:5px;letter-spacing:.6px}
.ssa-nav{padding:12px 10px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto}
.ssa-nav-group{font-size:10px;font-weight:800;color:#8b9aab;text-transform:uppercase;padding:9px 9px 6px;letter-spacing:.7px}
.ssa-nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#314b68;padding:9px 10px;border-radius:8px;margin:2px 0;font-weight:600;white-space:nowrap}
.ssa-nav a:hover{background:#eef6ff;color:#0d65bd}
.ssa-nav a.active{background:#e9f3ff;color:#0b67c0;font-weight:800}
.ssa-ico{width:18px;min-width:18px;text-align:center;font-size:15px}
.ssa-profile{flex:0 0 auto;border-top:1px solid #e7edf4;padding:12px 13px;background:#fbfdff}
.ssa-profile-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:#15385f}
.ssa-avatar{width:34px;height:34px;border-radius:50%;background:#e9f3ff;display:grid;place-items:center;color:#126ac1;font-weight:800}
.ssa-profile strong{font-size:12px}.ssa-profile small{display:block;color:#8291a3;margin-top:2px}
.ssa-logout{display:block;text-decoration:none;margin-top:9px;text-align:center;background:#ef4444;color:#fff;border-radius:7px;padding:8px;font-weight:800}

.ssa-content>.page{max-width:none;margin:0;padding:24px 24px 32px}

.ssa-page-identity{display:flex;align-items:center;gap:10px;margin-left:auto;padding:7px 12px;border:1px solid #dce8f5;border-radius:9px;background:#fff;color:#15385f;font-size:13px}.ssa-page-identity strong{font-weight:800}.ssa-page-identity span{color:#73869c;font-size:11px}.ssa-content .card form{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:16px 14px}.ssa-content .card form label{display:flex;flex-direction:column;gap:7px;font-weight:700;color:#203c5d}.ssa-content .card form label:has(textarea){grid-column:span 2}.ssa-content .card form input,.ssa-content .card form select,.ssa-content .card form textarea{width:100%;box-sizing:border-box;border:1px solid #cbd9e8;border-radius:9px;padding:11px 12px;background:#fff;color:#15385f;font-size:14px;outline:none}.ssa-content .card form input:focus,.ssa-content .card form select:focus,.ssa-content .card form textarea:focus{border-color:#2b7dcc;box-shadow:0 0 0 3px rgba(43,125,204,.12)}.ssa-content .card form textarea{min-height:90px;resize:vertical}.ssa-content .card form input[type=hidden]{display:none}.ssa-content .card form button{grid-column:span 1;border:0;border-radius:9px;background:#178b58;color:#fff;font-weight:800;padding:11px 18px;cursor:pointer}.ssa-content .card form button:hover{filter:brightness(.96)}@media(max-width:1000px){.ssa-content .card form{grid-template-columns:repeat(2,minmax(180px,1fr))}}@media(max-width:700px){.ssa-content .card form{grid-template-columns:1fr}.ssa-content .card form label:has(textarea){grid-column:span 1}}

/* v17: keep the sidebar permanently left and keep all working content in the right scroll area. */
.ssa-sidebar{position:fixed !important;left:0 !important;top:0 !important;bottom:0 !important;width:280px !important;height:100vh !important;overflow:hidden !important;}
.ssa-nav{overflow-y:auto !important;overflow-x:hidden !important;min-height:0 !important;}
.ssa-content{margin-left:280px !important;width:calc(100% - 280px) !important;min-width:0 !important;box-sizing:border-box !important;overflow-x:hidden !important;}
.ssa-content>.page{width:100% !important;max-width:none !important;box-sizing:border-box !important;min-width:0 !important;}
.ssa-content .card{max-width:100% !important;box-sizing:border-box !important;}
.ssa-content table{max-width:100%;}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;box-sizing:border-box;}
@media(max-width:700px){.ssa-content{margin-left:280px !important;width:calc(100% - 280px) !important;min-width:700px !important;}}
</style></head>
<body class="auth-body">
<main class="auth-card auth-wide">
  <div class="auth-brand"><span>🩸</span><div><strong>BLOOD DONOR</strong><small>Temporary Testing Registration</small></div></div>
  <h1>Create Test Donor Account</h1><p class="auth-subtitle">This registration is temporary for testing the Normal Blood Donor flow.</p>
  <div id="authMessage" class="message"></div>
  <form id="registerForm" class="auth-form form-grid">
    <label>Full Name<input name="full_name" required></label>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
    <label>Confirm Password<input name="confirm_password" type="password" minlength="6" autocomplete="new-password" required></label>
    <label>Blood Group<select name="blood_group" required><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></label>
    <label>Mobile<input name="phone" required></label>
    <label>Email<input name="email" type="email"></label>
    <label>Date of Birth<input name="date_of_birth" type="date"></label>
    <label>Gender<select name="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></label>
    <label>District<input name="district" required></label>
    <label>Area<input name="area" required></label>
    <label>Upazila<input name="upazila"></label>
    <label class="wide">Address<textarea name="address"></textarea></label>
    <div class="form-actions wide"><a class="btn btn-light" href="/login">Back to Login</a><button class="btn btn-save" type="submit">Create Account</button></div>
  </form>
</main>
<script>
const form=document.getElementById('registerForm'), msg=document.getElementById('authMessage');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='message';
  try{const body=Object.fromEntries(new FormData(form));const r=await fetch('/system_super_administrator/blood-donor-register/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Registration failed.');msg.textContent=`Account created successfully. Username: ${d.account.username}`;msg.className='message show success';form.reset();setTimeout(()=>window.location.href='/login',900);}
  catch(err){msg.textContent=err.message;msg.className='message show error';}
});
</script>
</div></div></body></html>
