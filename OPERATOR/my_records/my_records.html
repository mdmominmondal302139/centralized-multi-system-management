    <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPERATOR — My Records</title><style>:root{--bg:#f4f7fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--side:#101827;--side2:#263750;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;background:var(--side);color:#fff;padding:22px 15px;overflow:auto}
.brand{font-weight:800;font-size:18px;margin-bottom:6px}.scope{font-size:12px;opacity:.7;margin-bottom:20px}
.sidebar a{display:block;color:#dbe4f0;text-decoration:none;padding:11px 12px;border-radius:7px;margin:3px 0}
.sidebar a:hover,.sidebar a.active{background:var(--side2);color:#fff}.sidebar .logout{margin-top:18px;border-top:1px solid #334155;padding-top:16px}
.main{margin-left:270px;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1,h2{margin-top:0}.muted{color:var(--muted);font-size:13px}.badge{padding:8px 12px;background:#e8eef8;border-radius:20px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,.work{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card b{display:block;font-size:22px;margin-top:8px}.work{min-height:400px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff}textarea{min-height:100px;resize:vertical}
.field{margin-bottom:14px}.button{border:0;background:var(--ink);color:#fff;padding:10px 14px;border-radius:7px;cursor:pointer}.button.primary{background:var(--accent)}
table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px} .empty{padding:30px;text-align:center;color:var(--muted)}
.notice{padding:12px 14px;border-radius:8px;background:#eef5ff;margin-bottom:16px;font-size:13px}.danger{background:#fff1f2}.success{background:#ecfdf5}
@media(max-width:900px){.sidebar{width:220px}.main{margin-left:220px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body>
    {% include 'operator_sidebar.html' %}
    <main class="main"><div class="head"><div><h1>My Records</h1><div class="muted">Operator working page — all work is performed on the right side.</div></div><div class="badge">OPERATOR</div></div><section class="work"><h2>My Production / Attendance / Task / Report Records</h2><div class="notice">Only records belonging to your own account are shown.</div><table><thead><tr><th>Date</th><th>Record Type</th><th>Status</th><th>Details</th></tr></thead><tbody><tr><td colspan="4" class="empty">No records available yet.</td></tr></tbody></table></section></main>
    <script>document.querySelectorAll('.sidebar a').forEach(a=>{if(a.dataset.page==='My Records')a.classList.add('active')});</script>
    </body></html>
