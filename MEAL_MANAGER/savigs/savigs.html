<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savigs</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="page"><header><h1>Savigs</h1><a href="/logout">Logout</a></header>{% if message %}<div class="ok">{{ message }}</div>{% endif %}{% if error %}<div class="err">{{ error }}</div>{% endif %}<section class="card"><h2>Entry</h2><form method="post"><label>Name<input name="name"></label><label>Status<input name="status"></label><label>Note<input name="note"></label><input type="hidden" name="action" value="save"><button>Save</button></form></section><section class="card"><h2>Records</h2><form method="get"><input name="search" placeholder="Search" value="{{ request.args.get('search','') }}"><button>Search</button></form><table><thead><tr><th>SL</th><th>Record</th><th>Action</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ loop.index }}</td><td><pre>{{ r|tojson(indent=2) }}</pre></td><td><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="record_id" value="{{ r.get('_id','') }}"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="3">No records found.</td></tr>{% endfor %}</tbody></table></section></main></body></html>
