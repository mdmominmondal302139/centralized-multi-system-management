<style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}.bo-main{margin-left:260px;padding:28px;max-width:1200px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:20px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:16px}.stat small{color:#64748b}.stat strong{display:block;font-size:25px;margin-top:7px}.btn{display:inline-block;border:0;border-radius:7px;padding:10px 14px;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.green{background:#15803d}.red{background:#b91c1c}.gray{background:#64748b}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f8fafc}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.alert{padding:11px;border-radius:8px;margin-bottom:15px}.bad{background:#fee2e2;color:#991b1b}.good{background:#dcfce7;color:#166534}.muted{color:#64748b}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:900px){.bo-main{margin-left:0;padding:18px}.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style><aside class="sidebar"><strong>BRANCH OFFICER</strong><a href="/branch_officer/branch_management">Branch Management</a><a href="/branch_officer/branch_officer_dashboard">Branch Officer Dashboard</a><a href="/branch_officer/branch_officer_expense">Branch Officer Expense</a><a href="/branch_officer/branch_officer_records">Branch Officer Records</a><a href="/branch_officer/expense">Expense</a><a href="/branch_officer/member_transfer">Member Transfer</a><a href="/branch_officer/member_transfer_history">Member Transfer History</a><a href="/branch_officer/member_transfer_request">Member Transfer Request</a><a href="/branch_officer/member_transfer_sent">Member Transfer Sent</a><a href="/branch_officer/records">Records</a><a href="/branch_officer/register">Register</a></aside><main class="bo-main"><h1>📤 Create Member Transfer Request</h1>{% if error %}<div class="alert bad">{{error}}</div>{% endif %}<div class="card"><form method="post"><div class="formgrid"><div><label>Member</label><select name="member_id" required><option value="">Select Member</option>{% for m in members %}<option value="{{m.id}}">{{m.name}}{% if m.username %} — {{m.username}}{% endif %}</option>{% endfor %}</select></div><div><label>Current Branch</label><input value="{{branch_name}}" readonly></div><div><label>Transfer To</label><select name="to_branch_id" required><option value="">Select Target Branch</option>{% for b in branches %}<option value="{{b.id}}">{{b.name}}</option>{% endfor %}</select></div><div><label>Transfer Effective Date</label><input type="date" name="effective_date" required></div><div class="full"><label>Reason</label><textarea name="reason" required></textarea></div><div class="full"><label>Additional Note</label><textarea name="note"></textarea></div><div class="full actions"><a class="btn gray" href="{{url_for('branch_officer_member_transfer.page')}}">Cancel</a><button class="btn" type="submit">Submit Request</button></div></div></form></div></main>
